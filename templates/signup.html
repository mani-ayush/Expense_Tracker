<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Expense Tracker Pro</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons CDN -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100 min-h-screen flex items-center justify-center p-4 antialiased">
    <div class="max-w-md w-full bg-white dark:bg-slate-900 rounded-3xl p-8 border border-slate-200 dark:border-slate-800 shadow-xl space-y-6">
        
        <!-- Header -->
        <div class="text-center space-y-2">
            <div class="w-12 h-12 rounded-2xl bg-indigo-600 flex items-center justify-center text-white mx-auto shadow-md shadow-indigo-200 dark:shadow-none">
                <i data-lucide="user-plus" class="w-6 h-6"></i>
            </div>
            <h1 class="text-xl font-black text-slate-900 dark:text-white">Create an Account</h1>
            <p class="text-xs text-slate-500 dark:text-slate-400">Start tracking with a clean, fresh slate</p>
        </div>

        <!-- Signup Form (POST request clears sample data automatically) -->
        <form action="/signup" method="POST" class="space-y-4">
            <div>
                <label class="block text-xs font-bold text-slate-600 dark:text-slate-300 uppercase mb-1">Full Name</label>
                <input type="text" name="name" required placeholder="John Doe" class="w-full px-3.5 py-2.5 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl text-xs text-slate-900 dark:text-slate-100 focus:ring-2 focus:ring-indigo-500 focus:outline-none">
            </div>
            <div>
                <label class="block text-xs font-bold text-slate-600 dark:text-slate-300 uppercase mb-1">Email Address</label>
                <input type="email" name="email" required placeholder="name@example.com" class="w-full px-3.5 py-2.5 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl text-xs text-slate-900 dark:text-slate-100 focus:ring-2 focus:ring-indigo-500 focus:outline-none">
            </div>
            <div>
                <label class="block text-xs font-bold text-slate-600 dark:text-slate-300 uppercase mb-1">Password</label>
                <input type="password" name="password" required placeholder="••••••••" class="w-full px-3.5 py-2.5 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl text-xs text-slate-900 dark:text-slate-100 focus:ring-2 focus:ring-indigo-500 focus:outline-none">
            </div>
            <button type="submit" class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-xl text-xs shadow-md shadow-indigo-200 dark:shadow-none transition">
                Get Started with Fresh Tracker
            </button>
        </form>

        <!-- Footer Link -->
        <p class="text-center text-xs text-slate-500 dark:text-slate-400">
            Already have an account? <a href="/login" class="text-indigo-600 dark:text-indigo-400 font-bold hover:underline">Log In</a>
        </p>

    </div>

    <script>
        lucide.createIcons();
    </script>
</body>
</html>
