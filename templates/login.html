<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In - Expense Tracker Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100 min-h-screen flex items-center justify-center p-4">
    <div class="max-w-md w-full bg-white dark:bg-slate-900 rounded-3xl p-8 border border-slate-200 dark:border-slate-800 shadow-xl space-y-6">
        <div class="text-center space-y-2">
            <div class="w-12 h-12 rounded-2xl bg-blue-600 flex items-center justify-center text-white mx-auto shadow-md">
                <i data-lucide="log-in" class="w-6 h-6"></i>
            </div>
            <h1 class="text-xl font-black text-slate-900 dark:text-white">Welcome Back</h1>
            <p class="text-xs text-slate-500">Log in to access your financial dashboard</p>
        </div>

        <form action="/dashboard" method="GET" class="space-y-4">
            <div>
                <label class="block text-xs font-bold text-slate-600 dark:text-slate-300 uppercase mb-1">Email Address</label>
                <input type="email" required placeholder="name@example.com" class="w-full px-3.5 py-2.5 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl text-xs focus:ring-2 focus:ring-blue-500 focus:outline-none">
            </div>
            <div>
                <label class="block text-xs font-bold text-slate-600 dark:text-slate-300 uppercase mb-1">Password</label>
                <input type="password" required placeholder="••••••••" class="w-full px-3.5 py-2.5 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl text-xs focus:ring-2 focus:ring-blue-500 focus:outline-none">
            </div>
            <button type="submit" class="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-xl text-xs shadow-md transition">Log In to Dashboard</button>
        </form>

        <p class="text-center text-xs text-slate-500">
            Don't have an account? <a href="/signup" class="text-blue-600 font-bold hover:underline">Sign Up</a>
        </p>
    </div>
    <script>lucide.createIcons();</script>
</body>
</html>
